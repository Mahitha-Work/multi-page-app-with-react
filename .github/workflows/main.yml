name: Build and Deploy Multi-Page App

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Opt into Node 24 for the runner engine to avoid deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false # Fails the pipeline if linting fails

      - name: Build Project (Webpack)
        # This NODE_OPTIONS fix solves the 'digital envelope routines' error
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Deploy to GitHub Pages
        # Only deploy on pushes/merges to main, not on pull requests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # Using 'build' as per your configuration
          branch: gh-pages
          git-config-name: 'GitHub Action'
          git-config-email: 'action@github.com'
