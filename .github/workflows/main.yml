name: Build and Deploy Multi-Page App

# 1. Triggers
on:
  push:
    branches:
      - main  # Trigger workflow only on pushes to main

# 2. Permissions
permissions:
  contents: write  # Needed to push files to gh-pages branch
  pages: write     # Needed to deploy to GitHub Pages
  id-token: write  # Required for trusted deployment

# 3. Jobs
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Project (Webpack)
        run: npm run build
        # Assumes "build": "webpack --mode production" in package.json

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # <-- CHANGE THIS to 'build' if your Webpack outputs to build/
          branch: gh-pages # The branch the action should deploy to
          git-config-name: 'GitHub Action'
          git-config-email: 'action@github.com'
